# =============================================================================
# Monte Carlo simulation settings
# =============================================================================
# 10,000 independent trials; convergence verified at 20K (mean/CI change < 1%)

monte_carlo:
  num_trials: 10000
  seed: null                     # Random seed (null = random)
  convergence_threshold: 0.01    # Running mean change < 1% over final 2000 samples

  # Stochastic variables
  variables:
    workload_growth:
      # Log-normal, µ=log(1.05), σ=0.05; correlated with model size (ρ=0.4)
      # Cloud provider AI growth:
      #   https://futurumgroup.com/insights/microsoft-q3-fy-2025-earnings
      #   https://blog.google/inside-google/message-ceo/alphabet-earnings-q2-2024/
      #   https://aimagazine.com/news/how-amazon-achieved-rocketing-sales-and-growth-from-ai
      distribution: lognormal
      mu: 0.0488                 # log(1.05)
      sigma: 0.05
      correlation:
        model_size_growth: 0.4

    model_size_growth:
      # Log-normal, fit to historical P50; capped at ±2σ
      # https://epoch.ai/data/notable-ai-models
      # https://epoch.ai/gradient-updates/frontier-language-models-have-become-much-smaller
      distribution: lognormal
      mu: null                   # Auto-fitted from data
      sigma: null
      cap_sigma: 2.0

    gpu_perf_per_watt:
      # Normal, mean from regression, σ=0.1µ; ρ=-0.5 with price
      # https://epoch.ai/blog/trends-in-machine-learning-hardware
      distribution: normal
      sigma_fraction: 0.1        # sigma = 10% of mean
      correlation:
        gpu_price_change: -0.5

    gpu_price_change:
      # Triangular, min=-15%, mode=0%, max=+20%
      # https://cyfuture.cloud/kb/gpu/what-is-the-price-of-an-nvidia-dgx-h100-system
      distribution: triangular
      min: -0.15                 # -15% (cheaper)
      mode: 0.0                  # No change
      max: 0.20                  # +20% (more expensive)

    release_interval:
      # Discrete, {1, 1.5, 2} years — uniform sampling
      distribution: discrete
      values: [1.0, 1.5, 2.0]   # Years between GPU generations

    electricity_price:
      # Log-normal, mean=regional avg., σ=15%
      # https://www.gridstatus.io/
      distribution: lognormal
      sigma_fraction: 0.15       # 15% of regional mean

    pue:
      # Normal, mean=baseline, σ=0.05; range 1.1–1.3
      # https://sustainability.aboutamazon.com/products-services/aws-cloud
      # https://datacenters.google/efficiency/
      # https://datacenters.microsoft.com/sustainability/efficiency/
      distribution: normal
      mean: null                 # Uses baseline PUE
      sigma: 0.05

    server_lifetime:
      # Discrete, {4, 5, 6} years — uniform sampling
      # Wang et al., "Designing cloud servers for lower carbon," ISCA 2024
      distribution: discrete
      values: [4, 5, 6]          # Years
