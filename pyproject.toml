[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dc-tco"
version = "0.1.0"
description = "TCO-driven framework for evaluating AI datacenter lifecycle decisions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "pyyaml>=6.0",
    "scipy>=1.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "seaborn>=0.12"]
regression = ["scikit-learn>=1.0"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "seaborn>=0.12", "scikit-learn>=1.0"]
all = ["matplotlib>=3.5", "seaborn>=0.12", "scikit-learn>=1.0"]

[project.scripts]
dc-tco = "dc_tco.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dc_tco*"]
